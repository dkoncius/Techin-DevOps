apiVersion: v1
kind: Namespace
metadata:
  name: etalonas
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: etalonas
data:
  DB_HOST: postgres
  DB_NAME: notes
  DB_USER: notes
---
# Secret šablonas. Tikrą reikšmę kurti komanda, NE commit'inti:
#   kubectl -n etalonas create secret generic db-secret --from-literal=DB_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: etalonas
type: Opaque
stringData:
  DB_PASSWORD: "PAKEISTI-KOMANDA-NE-GIT"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: etalonas
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/dkoncius/etalonas/api:sha-PAKEISTI
          ports:
            - containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-secret, key: DB_PASSWORD}
            - name: DATABASE_URL
              value: postgresql+psycopg2://notes:$(DB_PASSWORD)@postgres:5432/notes
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: etalonas
spec:
  selector: {app: api}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: etalonas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts: [etalonas.example.lt]
      secretName: etalonas-tls
  rules:
    - host: etalonas.example.lt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 80}}
