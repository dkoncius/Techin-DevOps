name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "terraform/**"
      - "azure/terraform/**"
      - "local/scripts/**"
      - "azure/scripts/**"
  pull_request:

# Numatytosios teisės - tik skaitymas; darbai, kuriems reikia daugiau, prašo patys.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/api
  # Trivy per prisegtą Docker digest'ą (v0.76.2), ne per trečiosios šalies action'ą.
  # Priežastis: 2026-03 Trivy tiekimo grandinės incidentas (GHSA-69fq-xp46-6x23),
  # kai buvo perrašytos trivy-action / setup-trivy žymos. Digest'ų perrašyti negalima.
  TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  test:
    name: Lint ir testai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  trivy:
    name: Trivy (priklausomybės, paslaptys, konfigūracijos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Helm lint (dev, prod, local, azure reikšmės)
        run: |
          helm lint helm/miniplatforma -f helm/miniplatforma/values-dev.yaml
          helm lint helm/miniplatforma -f local/values-local.yaml
          helm lint helm/miniplatforma -f local/values-local.yaml
          helm lint helm/miniplatforma -f azure/values-azure.yaml
      - name: Helm šablonų atvaizdavimas dev, prod, local, azure (Trivy nemoka chart'ų su required)
        run: |
          mkdir -p rendered
          helm template etalonas helm/miniplatforma -f helm/miniplatforma/values-dev.yaml  > rendered/dev.yaml
          helm template etalonas helm/miniplatforma -f local/values-local.yaml > rendered/prod.yaml
          helm template etalonas helm/miniplatforma -f local/values-local.yaml  > rendered/local.yaml
          helm template etalonas helm/miniplatforma -f azure/values-azure.yaml  > rendered/azure.yaml
      - name: Trivy fs - priklausomybių pažeidžiamumai ir paslaptys (CRITICAL, HIGH)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
            fs --no-progress --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 /src
      - name: Trivy config - Dockerfile, Kubernetes, Terraform (HIGH, CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL --exit-code 1 /src

  secrets:
    name: Gitleaks (visa Git istorija)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read     # gitleaks-action pull_request įvykiui kreipiasi į GitHub API (tik skaitymas)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # gitleaks skaito visą Git istoriją
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-push:
    name: Atvaizdo sukūrimas ir siuntimas į GHCR
    needs: [test, trivy, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64   # arm64: docker-desktop/Apple Silicon; amd64: k3s/Azure
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # GitOps: CI nediegia pats, tik įrašo naują atvaizdo žymą į Git; Argo CD pamato ir diegia.
  gitops:
    name: GitOps - atnaujinti image.tag
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Atnaujinti image.tag helm/values.yaml
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i "s|^  tag: .*|  tag: ${TAG}|; s|^  repository: .*|  repository: ${IMAGE}|" helm/miniplatforma/values.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "ci: atvaizdas ${TAG} [skip ci]" || echo "nėra pakeitimų"
          git push
