apiVersion: v1
kind: Service
metadata:
  name: {{ include "mp.dbHost" . }}
spec:
  clusterIP: None
  selector: {app: {{ include "mp.dbHost" . }}}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mp.dbHost" . }}
spec:
  serviceName: {{ include "mp.dbHost" . }}
  replicas: 1
  selector:
    matchLabels: {app: {{ include "mp.dbHost" . }}}
  template:
    metadata:
      labels: {app: {{ include "mp.dbHost" . }}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_DB, value: {{ .Values.db.name | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.db.user | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "mp.secretName" . }}, key: DB_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.db.user | quote }}]
            periodSeconds: 5
          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
