# ŠABLONAS. Tikro rakto čia NEDĖTI ir šio failo su raktu į Git nekelti.
# Naudojimas: nukopijuok į local/argocd/repo-secret.yaml (jis ignoruojamas Git), įklijuok raktą ir:
#   kubectl apply -f local/argocd/repo-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: repo-etalonas-local
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@github.com:dkoncius/etalonas.git
  sshPrivateKey: |
    <IKLIJUOTI_PRIVATU_READ_ONLY_DEPLOY_RAKTA>
