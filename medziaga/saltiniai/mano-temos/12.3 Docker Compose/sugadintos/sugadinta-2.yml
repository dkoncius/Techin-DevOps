# Sugadinta byla nr. 2: API + DB + Nginx. Paleidimas: docker compose -f sugadinta-2.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lab
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql+psycopg2://lab:${DB_PASSWORD}@localhost:5432/lab
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
